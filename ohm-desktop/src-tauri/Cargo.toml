[package]
name = "ohm-desktop"
version = "0.1.0"
description = "Open Haptic Mouse desktop app (simulator mode)"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
ohm-core = { path = "../../ohm-core" }
ohm-simulator = { path = "../../ohm-simulator" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.7", features = [] }
