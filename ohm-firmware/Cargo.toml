[package]
name = "ohm-firmware"
version = "0.1.0"
edition = "2021"

[features]
default = ["sim-sensor"]
sim-sensor = []

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-futures = "0.1.2"
embassy-executor ={ version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32g474re", "time-driver-any", "exti", "defmt", "single-bank"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
ohm-core = { version = "0.1.0", path = "../ohm-core" }
ohm-protocol = { version = "0.1.0", path = "../ohm-protocol" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"
[workspace]
