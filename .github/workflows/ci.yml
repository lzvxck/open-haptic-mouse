name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  core-no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ohm-core -p ohm-protocol --target thumbv7em-none-eabihf

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ohm-firmware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ohm-firmware
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flip-link
          key: flip-link-${{ runner.os }}
      - run: command -v flip-link || cargo install flip-link --locked
      - run: cargo build --release
      - run: cargo clippy --release -- -D warnings
      - run: $(rustc --print target-libdir)/../bin/llvm-size target/thumbv7em-none-eabihf/release/ohm-firmware
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ohm-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ohm-desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
